<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
</head>
<body>
  <h2>{{ title }}</h2>
  <p>A new audio submission has been received.</p>
  {% if recording.subject %}
  <p><strong>Subject:</strong> {{ recording.subject }}</p>
  {% endif %}
  {% if recording.email %}
  <p><strong>From:</strong> {{ recording.email }}</p>
  {% endif %}
  {% if site_url %}
  <p>
    <a href="{{ site_url }}">Open {{ site_url }}</a>
  </p>
  {% endif %}
</body>
</html>
